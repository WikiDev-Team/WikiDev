<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Definir nova senha - WikiDev</title>
    <link rel="icon" type="image/png" href="/static/wikidev_logo.png">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="/static/theme.js"></script>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/auth.css">
</head>
<body class="auth-page">
    <button type="button" class="theme-toggle auth-theme-toggle" aria-label="Alternar tema">☀️</button>
    <main class="auth-shell">
        <section class="auth-card">
            <img src="/static/wikidev_logo.png" alt="" class="auth-logo">
            {% if valid %}
                <h1>Defina uma nova senha</h1>
                <p class="auth-subtitle">O link é de uso único e expira automaticamente.</p>
                <form method="post" action="/reset-password" hx-post="/reset-password" hx-target="#reset-message" hx-swap="innerHTML" class="auth-form">
                    <input type="hidden" name="token" value="{{ token }}">
                    <label><span>Nova senha</span><input type="password" name="password" minlength="6" autocomplete="new-password" required></label>
                    <label><span>Confirme a senha</span><input type="password" name="password_confirm" minlength="6" autocomplete="new-password" required></label>
                    <button type="submit" class="primary-button">Alterar senha</button>
                </form>
                <div id="reset-message" aria-live="polite"></div>
            {% else %}
                <h1>Link inválido</h1>
                <p class="auth-subtitle">Este link expirou ou já foi utilizado.</p>
                <a href="/forgot-password" class="secondary-link">Solicitar novo link</a>
            {% endif %}
        </section>
    </main>
</body>
</html>
