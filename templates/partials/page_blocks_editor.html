<div id="page-blocks-editor" class="workspace-card page-blocks-editor">
    <header class="workspace-header blocks-editor-header">
        <div>
            <span class="eyebrow">{{ page.page_type.value }} · {{ page.status.value }}</span>
            <h1>{{ page.title }}</h1>
            {% if page.summary %}<p>{{ page.summary }}</p>{% endif %}
        </div>
        {% if can_edit %}<div class="workspace-actions"><button type="button" class="secondary-action" hx-get="/pages/{{ page.id }}/metadata/edit" hx-target="#page-blocks-editor" hx-swap="outerHTML">Configurações</button></div>{% endif %}
    </header>
    {% include "partials/page_blocks_list.html" %}
    {% if can_edit %}
    <div class="block-add-actions"><button type="button" hx-post="/pages/{{ page.id }}/blocks" hx-vals='{"block_type": "text"}' hx-target="#page-blocks-list" hx-swap="beforeend">+ Texto</button><button type="button" hx-post="/pages/{{ page.id }}/blocks" hx-vals='{"block_type": "code"}' hx-target="#page-blocks-list" hx-swap="beforeend">+ Código</button></div>
    {% elif not blocks %}<p class="empty-state">Esta página ainda não possui conteúdo.</p>{% endif %}
</div>
