<article id="block-{{ block.id }}" class="page-block page-block-editing">
	<form
		hx-patch="/pages/blocks/{{ block.id }}"
		hx-target="#block-{{ block.id }}"
		hx-swap="outerHTML"
	>
		{% if block.block_type.value == "code" %}
			<div class="block-form-row">
				<label for="language-{{ block.id }}">Linguagem</label>

				<select id="language-{{ block.id }}" name="language">
					<option value="python" {% if block.language == "python" %}selected{% endif %}>Python</option>
					<option value="c" {% if block.language == "c" %}selected{% endif %}>C</option>
					<option value="cpp" {% if block.language == "cpp" %}selected{% endif %}>C++</option>
					<option value="java" {% if block.language == "java" %}selected{% endif %}>Java</option>
					<option value="javascript" {% if block.language == "javascript" %}selected{% endif %}>JavaScript</option>
					<option value="typescript" {% if block.language == "typescript" %}selected{% endif %}>TypeScript</option>
					<option value="go" {% if block.language == "go" %}selected{% endif %}>Go</option>
					<option value="rust" {% if block.language == "rust" %}selected{% endif %}>Rust</option>
					<option value="sql" {% if block.language == "sql" %}selected{% endif %}>SQL</option>
					<option value="bash" {% if block.language == "bash" %}selected{% endif %}>Bash</option>
					<option value="xml" {% if block.language == "xml" %}selected{% endif %}>HTML</option>
					<option value="css" {% if block.language == "css" %}selected{% endif %}>CSS</option>
					<option value="json" {% if block.language == "json" %}selected{% endif %}>JSON</option>
					<option value="plaintext" {% if block.language == "plaintext" %}selected{% endif %}>Texto simples</option>
				</select>

			</div>
		{% else %}
			<div class="block-form-row">
				<label for="font_size">Tamanho da fonte</label>

				<select name="font_size" id="font_size">
					<option value="small" {% if block.font_size == "small" %}selected{% endif %}>Pequeno</option>
					<option value="normal" {% if block.font_size == "normal" %}selected{% endif %}>Normal</option>
					<option value="large" {% if block.font_size == "large" %}selected{% endif %}>Grande</option>
					<option value="title" {% if block.font_size == "title" %}selected{% endif %}>Título</option>
				</select>

			</div>
			
			<input type="hidden" name="language" value="">
		{% endif %}

		<div class="block-form-row">
			<label for="content-{{ block.id }}">Conteúdo</label>

			<textarea
				id="content-{{ block.id }}"
				name="content"
				rows="{% if block.block_type.value == 'code' %}10{% else %}6{% endif %}"
				{% if block.block_type.value == 'code' %}class="code-input" spellcheck="false"{% else %}placeholder="Escreva em Markdown: # título, **negrito**, `código`, - listas, [links](https://...)"{% endif %}
			>{{ block.content }}</textarea>
			{% if block.block_type.value != 'code' %}<small class="field-hint">Aceita Markdown: títulos, listas, links, tabelas e `código`.</small>{% endif %}
		</div>

		<div class="page-block-actions">
			<button type="submit">
				Salvar
			</button>

			<button
				type="button"
				hx-get="/pages/blocks/{{ block.id }}"
				hx-target="#block-{{ block.id }}"
				hx-swap="outerHTML"
			>
				Cancelar
			</button>
		</div>
	</form>
</article>
