<header class="topbar">
    <div class="topbar-brand">
        <a href="/dashboard" class="topbar-logo-link" aria-label="Página inicial">
            <img src="/static/wikidev_logo.png" alt="WikiDev" class="topbar-logo">
        </a>
        <div><strong>WikiDev</strong><small>Sua base de conhecimento colaborativa</small></div>
    </div>

    <nav class="main-nav" aria-label="Navegação principal">
        <a href="/dashboard"{% if active_page == 'dashboard' %} class="active"{% endif %}>Home</a>
        <a href="/friends" class="nav-with-badge{% if active_page == 'friends' %} active{% endif %}">
            Amigos
            {% if pending_friend_requests|default(0) %}<span class="nav-badge">{{ pending_friend_requests }}</span>{% endif %}
        </a>
        <a href="/forum"{% if active_page == 'forum' %} class="active"{% endif %}>Fórum</a>
    </nav>

    <div id="search-container" class="topbar-search">
        <label class="visually-hidden" for="global-search">Buscar usuários, páginas ou pastas</label>
        <input id="global-search" type="search" name="q" placeholder="Buscar usuários, páginas ou pastas..." autocomplete="off"
               hx-get="/busca" hx-trigger="input changed delay:350ms, search" hx-target="#search-results">
        <div id="search-results"></div>
    </div>

    <div class="topbar-right">
        <button type="button" class="theme-toggle" aria-label="Alternar tema">
            <img src="/static/sun_icon.png" alt="" class="theme-icon">
        </button>
        <a href="/profile" class="botao-user">{{ usuario.display_name or usuario.username }}</a>
        {% if show_sidebar_toggle|default(false) %}<button type="button" class="menu-hamburger" aria-label="Abrir ou fechar barra lateral" onclick="toggleSidebar()">≡</button>{% endif %}
    </div>
</header>
