<form
    class="comment-form{% if parent %} comment-reply-form{% elif editing_comment %} comment-edit-form{% endif %}"
    {% if editing_comment %}hx-patch="/comments/{{ editing_comment.id }}"{% else %}hx-post="{% if parent %}/comments/{{ parent.id }}/replies{% else %}/comments/pages/{{ page.id }}{% endif %}"{% endif %}
    hx-target="#page-discussion-{{ page.id }}"
    hx-swap="outerHTML"
>
    {% if parent %}
        <p class="comment-reply-context">
            Respondendo a @{{ parent.author.username if parent.author else 'usuário removido' }}
        </p>
    {% elif editing_comment %}
        <p class="comment-reply-context">Editando comentário</p>
    {% endif %}
    <label class="comment-body-field">
        <span class="sr-only">Texto do comentário</span>
        <textarea name="body" rows="3" required placeholder="Escreva um comentário">{% if editing_comment %}{{ editing_comment.body }}{% endif %}</textarea>
    </label>
    <div class="comment-code-fields"{% if not editing_comment or not editing_comment.code %} hidden{% endif %}>
        <label>
            <span>Linguagem</span>
            <select name="language"{% if editing_comment and editing_comment.code %} required{% endif %}>
                <option value="">Selecione</option>
                {% for value, label in comment_languages.items() %}
                    <option value="{{ value }}"{% if editing_comment and editing_comment.language == value %} selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </label>
        <label>
            <span>Código</span>
            <textarea name="code" rows="6" spellcheck="false">{% if editing_comment and editing_comment.code %}{{ editing_comment.code }}{% endif %}</textarea>
        </label>
        <button type="button" class="comment-link-button" onclick="removeCommentCode(this)">
            Remover código
        </button>
    </div>
    <div class="comment-form-actions">
        <button type="button" class="comment-link-button add-code-button" onclick="showCommentCode(this)"{% if editing_comment and editing_comment.code %} hidden{% endif %}>
            + Adicionar código
        </button>
        {% if parent or editing_comment %}
            <button type="button" class="comment-link-button" onclick="this.closest('#discussion-reply-form').replaceChildren()">
                Cancelar
            </button>
        {% endif %}
        <button type="submit" class="comment-submit-button">
            {% if parent %}Responder{% elif editing_comment %}Salvar{% else %}Comentar{% endif %}
        </button>
    </div>
</form>
