<div id="page-blocks-editor" class="workspace-card">
    <header class="workspace-header"><div><span class="eyebrow">Configurações</span><h1>Editar página</h1></div></header>
    <form class="stack-form" hx-patch="/pages/{{ page.id }}" hx-target="#page-blocks-editor" hx-swap="outerHTML">
        <label><span>Título</span><input type="text" name="title" value="{{ page.title }}" maxlength="200" required></label>
        <label><span>Resumo</span><textarea name="summary" rows="3">{{ page.summary or '' }}</textarea></label>
        <div class="form-grid">
            <label><span>Tipo</span><select name="page_type">{% for value, label in [('personal','Pessoal'),('official','Oficial'),('question','Pergunta'),('example','Exemplo'),('note','Nota')] %}<option value="{{ value }}" {% if page.page_type.value == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
            <label><span>Status</span><select name="status">{% for value, label in [('draft','Rascunho'),('published','Publicada'),('archived','Arquivada')] %}<option value="{{ value }}" {% if page.status.value == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
            <label><span>Pasta</span><select name="folder_id"><option value="">Sem pasta</option>{% for folder in owned_folders %}<option value="{{ folder.id }}" {% if page.folder_id == folder.id %}selected{% endif %}>{{ folder.name }}</option>{% endfor %}</select></label>
        </div>
        <div class="form-actions"><button type="submit" class="primary-action">Salvar</button><button type="button" class="secondary-action" hx-get="/pages/{{ page.id }}/blocks-editor" hx-target="#page-blocks-editor" hx-swap="outerHTML">Cancelar</button><button type="button" class="danger-action" hx-delete="/pages/{{ page.id }}" hx-confirm="Excluir esta página e todo o seu conteúdo?" hx-target="#page-editor-container" hx-swap="innerHTML">Excluir página</button></div>
    </form>
</div>
