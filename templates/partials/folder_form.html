<section class="workspace-card">
    <header class="workspace-header">
        <div><span class="eyebrow">Organização</span><h1>{{ 'Editar pasta' if folder else 'Nova pasta' }}</h1></div>
    </header>
    <form class="stack-form" {% if folder %}hx-patch="/folders/{{ folder.id }}/ui"{% else %}hx-post="/folders/ui"{% endif %} hx-target="#page-editor-container" hx-swap="innerHTML">
        <label><span>Nome</span><input type="text" name="name" value="{{ folder.name if folder else '' }}" maxlength="150" required></label>
        <label><span>Descrição</span><textarea name="description" rows="4">{{ folder.description if folder else '' }}</textarea></label>
        <div class="form-grid">
            <label><span>Visibilidade</span>
                <select name="visibility">
                    <option value="private" {% if not folder or folder.visibility.value == 'private' %}selected{% endif %}>Privada</option>
                    <option value="public" {% if folder and folder.visibility.value == 'public' %}selected{% endif %}>Pública</option>
                </select>
            </label>
            <label><span>Pasta superior</span>
                <select name="parent_folder_id">
                    <option value="">Nenhuma</option>
                    {% for item in owned_folders %}<option value="{{ item.id }}" {% if selected_parent_id == item.id %}selected{% endif %}>{{ item.name }}</option>{% endfor %}
                </select>
            </label>
        </div>
        <div class="form-actions"><button type="submit" class="primary-action">{{ 'Salvar alterações' if folder else 'Criar pasta' }}</button><button type="button" class="secondary-action" onclick="showWelcome()">Cancelar</button>{% if folder %}<button type="button" class="danger-action" hx-delete="/folders/{{ folder.id }}/ui" hx-target="#page-editor-container" hx-swap="innerHTML" hx-confirm="Excluir esta pasta? As páginas serão mantidas sem pasta.">Excluir pasta</button>{% endif %}</div>
    </form>
</section>
