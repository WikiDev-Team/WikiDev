<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar senha - WikiDev</title>
    <link rel="icon" type="image/png" href="/static/wikidev_logo.png">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="/static/theme.js"></script>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/auth.css">
</head>
<body class="auth-page">
    <button type="button" class="theme-toggle auth-theme-toggle" aria-label="Alternar tema">☀️</button>
    <main class="auth-shell">
        <section class="auth-card">
            <img src="/static/wikidev_logo.png" alt="" class="auth-logo">
            <h1>Recuperar senha</h1>
            <p class="auth-subtitle">Informe seu e-mail. Se houver uma conta, enviaremos um link temporário.</p>
            {% if message %}<div class="success-message">{{ message }}</div>{% endif %}
            <form method="post" action="/forgot-password" hx-post="/forgot-password" hx-target="#recovery-message" hx-swap="innerHTML" class="auth-form">
                <label>
                    <span>E-mail</span>
                    <input type="email" name="email" autocomplete="email" required>
                </label>
                <button type="submit" class="primary-button">Enviar link</button>
            </form>
            <div id="recovery-message" aria-live="polite"></div>
            <p class="auth-inline-link"><a href="/login">Voltar ao login</a></p>
        </section>
    </main>
</body>
</html>
